<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valorant Randomizer</title>
    <link rel="stylesheet" href="Style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Botão de Configurações no canto superior direito do container -->
        <button id="btnSettings" class="settings-toggle-btn" aria-label="Configurações">
            <i class="fa-solid fa-gear"></i>
        </button>

        <!-- Aba Lateral de Configurações (Side Panel) -->
        <div id="settingsPanel" class="settings-panel">
            <div class="settings-header">
                <h2>SETTINGS</h2>
                <button id="btnCloseSettings" class="close-btn" aria-label="Fechar">&times;</button>
            </div>


            <!-- Container onde as armas serão geradas dinamicamente -->
            <div class="settings-content scrollable">
                <div id="AgenteGrid_main" class="agentes-grid-main">
                    <h3>AGENTS</h3><hr>
                    <div id="AgenteGrid" class="agentes-grid"></div>
                </div>
                <div id="weaponsGrid" class="weapons-grid-main">
                    <h3>PISTOL</h3><hr>
                    <div id="PistolGrid" class="weapons-grid"></div>
                    <h3>HALF BUY</h3><hr>
                    <div id="HalfGrid" class="weapons-grid"></div>
                    <h3>FULL BUY</h3><hr>
                    <div id="FullGrid" class="weapons-grid"></div>
                    <h3>FULL BUY 2</h3><hr>
                    <div id="Full2Grid" class="weapons-grid"></div>
                </div>
            </div>
        </div>

        <!-- Conteúdo do Randomizer -->
        <div class="portrait-wrapper">
            <h1 id="agente">AGENTE</h1>

            <div class="portrait">
                <img id="portraitImage" src="" alt="Portrait">

                <!-- Dado -->
                <button id="btnRandomize" class="dice-button" aria-label="Sortear Agente">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM7 7c.83 0 1.5.67 1.5 1.5S7.83 10 7 10s-1.5-.67-1.5-1.5S6.17 7 7 7zm0 10c-.83 0-1.5-.67-1.5-1.5S6.17 14 7 14s1.5.67 1.5 1.5S7.83 17 7 17zm5-5c-.83 0-1.5-.67-1.5-1.5S11.17 9 12 9s1.5.67 1.5 1.5S12.83 12 12 12zm5 5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5-1.5zm0-8c-.83 0-1.5-.67-1.5-1.5S16.17 6 17 6s1.5.67 1.5 1.5S17.83 9 17 9z"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="buttons">
            <button id="btnRandomize2" class="dice-button secondary" aria-label="Sortear Arma">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM7 7c.83 0 1.5.67 1.5 1.5S7.83 10 7 10s-1.5-.67-1.5-1.5S6.17 7 7 7zm0 10c-.83 0-1.5-.67-1.5-1.5S6.17 14 7 14s1.5.67 1.5 1.5S7.83 17 7 17zm5-5c-.83 0-1.5-.67-1.5-1.5S11.17 9 12 9s1.5.67 1.5 1.5S12.83 12 12 12zm5 5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5-1.5zm0-8c-.83 0-1.5-.67-1.5-1.5S16.17 6 17 6s1.5.67 1.5 1.5S17.83 9 17 9z"/>
                </svg>
            </button>
            <button id="btnGun1" class="square-button"><img id="gun1" src="" alt="Arma"><i id="Arma1">1</i>
                <span class="cadeado"><span class="haste"></span><span class="corpo"></span></span>
            </button>
            <button id="btnGun2" class="square-button"><img id="gun2" src="" alt="Arma"><i id="Arma2">2</i><span class="cadeado"><span class="haste"></span><span class="corpo"></span></span></button>
            <button id="btnGun3" class="square-button"><img id="gun3" src="" alt="Arma"><i id="Arma3">3</i><span class="cadeado"><span class="haste"></span><span class="corpo"></span></span></button>
            <button id="btnGun4" class="square-button"><img id="gun4" src="" alt="Arma"><i id="Arma4">4</i><span class="cadeado"><span class="haste"></span><span class="corpo"></span></span></button>
        </div>
    </div>

    <a href="https://github.com/FranthescoD/Valorant_Randomizer/tree/main" target="_blank" rel="noopener noreferrer" class="github-watermark" title="Ver no GitHub">
        <i class="fa-brands fa-github"></i>
    </a>

    <script src="script.js"></script>
</body>
</html>
