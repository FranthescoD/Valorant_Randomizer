<svg xmlns="http://www.w3.org/2000/svg" width="400" height="150" viewBox="0 0 400 150">
  <g fill="#ff4d6d">
    <!-- Linha horizontal superior -->
    <rect x="80" y="20" width="40" height="4" />
    
    <!-- Linha menor à direita -->
    <rect x="250" y="20" width="15" height="3" />
    
    <!-- Quadrados maiores (pontos focais) -->
    <rect x="220" y="100" width="10" height="10" />
    <rect x="270" y="35" width="8" height="8" />
    <rect x="350" y="100" width="10" height="10" />
    
    <!-- Micro-píxeis e ruído (espagados) -->
    <rect x="70" y="40" width="2" height="2" opacity="0.6" />
    <rect x="95" y="55" width="3" height="3" opacity="0.8" />
    <rect x="150" y="130" width="2" height="2" opacity="0.5" />
    <rect x="190" y="130" width="2" height="2" opacity="0.5" />
    <rect x="210" y="130" width="2" height="2" opacity="0.5" />
    <rect x="230" y="130" width="2" height="2" opacity="0.5" />
    <rect x="240" y="45" width="3" height="3" opacity="0.7" />
    <rect x="270" y="50" width="2" height="2" opacity="0.6" />
  </g>
</svg>
