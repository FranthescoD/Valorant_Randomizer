<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valorant Randomizer</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <div class="container">
        <!-- Faz o dado ficar em cima da imagem do agente -->
        <div class="portrait-wrapper">
            <h1 id="agente">AGENTE</h1>

            <div class="portrait">
                <img id="portraitImage" src="" alt="Portrait">

                <!-- Dado -->
                <button id="btnRandomize" class="dice-button" aria-label="Sortear Agente">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM7 7c.83 0 1.5.67 1.5 1.5S7.83 10 7 10s-1.5-.67-1.5-1.5S6.17 7 7 7zm0 10c-.83 0-1.5-.67-1.5-1.5S6.17 14 7 14s1.5.67 1.5 1.5S7.83 17 7 17zm5-5c-.83 0-1.5-.67-1.5-1.5S11.17 9 12 9s1.5.67 1.5 1.5S12.83 12 12 12zm5 5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm0-8c-.83 0-1.5-.67-1.5-1.5S16.17 6 17 6s1.5.67 1.5 1.5S17.83 9 17 9z"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="buttons">
            <button class="square-button"><img id="gun1" src="" alt="Arma"><i class="Arma1">1</i></button>
            <button class="square-button"><i class="round_2">2</i></button>
            <button class="square-button"><i class="round_3">3</i></button>
            <button class="square-button"><i class="round_4">4</i></button>
        </div>
    </div>

    <!-- Vinculando o arquivo JavaScript -->
    <script src="script.js"></script>
</body>
</html>
